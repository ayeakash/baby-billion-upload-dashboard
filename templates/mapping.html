<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Mapping</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --md-sys-color-background: #0D0D11;
            --md-sys-color-on-background: #E6E3E8;
            --md-sys-color-surface: #0D0D11;
            --md-sys-color-surface-container: #1C1B20;
            --md-sys-color-surface-container-high: #262529;
            --md-sys-color-surface-container-highest: #313035;
            --md-sys-color-on-surface: #E6E3E8;
            --md-sys-color-on-surface-variant: #CAC8CE;
            --md-sys-color-outline: #918F96;
            --md-sys-color-outline-variant: #3E3E43;
            --md-sys-color-primary: #A8B8FF;
            --md-sys-color-primary-container: #2D3F6E;
            --md-sys-color-on-primary: #162454;
            --md-sys-color-error: #FFB4AB;
            --md-custom-color-success: #7EDBA5;
            --md-sys-shape-sm: 8px;
            --md-sys-shape-md: 12px;
            --md-sys-shape-lg: 16px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 0.75rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(22,21,27,0.92), rgba(16,15,20,0.96));
            backdrop-filter: blur(20px) saturate(1.5);
            -webkit-backdrop-filter: blur(20px) saturate(1.5);
            border-bottom: 1px solid rgba(168,184,255,0.08);
            z-index: 10;
            position: sticky;
            top: 0;
            gap: 1rem;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .logo-icon {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--md-sys-color-primary-container), #573E5C);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 2px 12px rgba(168,184,255,0.15);
        }

        .logo-icon svg { width: 18px; height: 18px; stroke: var(--md-sys-color-on-primary); }

        .logo-text h1 {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--md-sys-color-on-surface);
        }

        .logo-text p {
            font-size: 0.68rem;
            color: var(--md-sys-color-outline);
            font-weight: 400;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            gap: 1rem;
            overflow: hidden;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
            padding-right: 4px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--md-sys-color-on-surface);
        }

        .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.8rem;
            padding: 0.5rem 1rem;
            border-radius: 24px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--md-sys-color-primary), #8BA0ED);
            color: var(--md-sys-color-on-primary);
        }

        .btn-primary:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .playlists-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .playlist-card {
            background: var(--md-sys-color-surface-container);
            border-radius: var(--md-sys-shape-md);
            border: 1px solid var(--md-sys-color-outline-variant);
            overflow: hidden;
            transition: all 0.2s;
        }

        .playlist-card:hover {
            background: var(--md-sys-color-surface-container-high);
            border-color: var(--md-sys-color-outline);
        }

        .playlist-header {
            padding: 0.875rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .playlist-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--md-sys-color-primary);
            flex: 1;
        }

        .playlist-count {
            font-size: 0.75rem;
            color: var(--md-sys-color-outline);
            background: var(--md-sys-color-surface-container-highest);
            padding: 0.2rem 0.5rem;
            border-radius: var(--md-sys-shape-sm);
            margin: 0 1rem;
        }

        .expand-icon {
            width: 16px; height: 16px;
            color: var(--md-sys-color-outline);
            transition: transform 0.25s;
            flex-shrink: 0;
        }

        .playlist-card.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .categories-list {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease;
            background: var(--md-sys-color-surface-container-low);
            border-top: 1px solid var(--md-sys-color-outline-variant);
        }

        .playlist-card.expanded .categories-list {
            grid-template-rows: 1fr;
        }

        .categories-inner {
            overflow: hidden;
            padding: 0;
        }

        .playlist-card.expanded .categories-inner {
            padding: 0.75rem 0.875rem;
        }

        .category-item {
            padding: 0.5rem 0.625rem;
            font-size: 0.8rem;
            color: var(--md-sys-color-on-surface-variant);
            border-left: 2px solid var(--md-sys-color-primary-container);
            margin-bottom: 0.25rem;
            border-radius: 2px;
        }

        .category-item:last-child {
            margin-bottom: 0;
        }

        .category-item span {
            font-weight: 500;
            color: var(--md-sys-color-on-surface);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            background: linear-gradient(145deg, var(--md-sys-color-surface-container), var(--md-sys-color-surface-container-low));
            border-radius: var(--md-sys-shape-lg);
            color: var(--md-sys-color-outline);
            border: 1px dashed var(--md-sys-color-outline-variant);
            margin: 2rem 0;
        }

        .error-message {
            background: rgba(255, 180, 171, 0.08);
            border: 1px solid rgba(255, 180, 171, 0.2);
            border-radius: var(--md-sys-shape-md);
            padding: 0.75rem 1rem;
            color: var(--md-sys-color-error);
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .stats-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .stat-item {
            background: var(--md-sys-color-surface-container);
            border-radius: var(--md-sys-shape-md);
            padding: 0.75rem 1rem;
            border: 1px solid var(--md-sys-color-outline-variant);
            flex: 0 0 auto;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--md-sys-color-outline);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--md-sys-color-primary);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--md-sys-color-outline); }
    </style>
</head>
<body>
    <header>
        <div class="logo-section">
            {% set nav_active = 'mapping' %}{% include "_nav.html" %}
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 3H5a2 2 0 0 0-2 2v4m0 0a2 2 0 0 0 2 2h4m-4-2h2"/><path d="M19 3h4a2 2 0 0 1 2 2v4m0 0a2 2 0 0 1-2 2h-4m4-2h-2"/></svg>
            </div>
            <div class="logo-text">
                <h1>Playlist Mapping</h1>
                <p>CMS playlist & category reference</p>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="header-bar">
            <h2 class="page-title">All Playlists & Categories</h2>
            <button class="btn btn-primary" id="refreshBtn" onclick="loadPlaylists()">
                <span id="refreshIcon">🔄</span>
                Refresh
            </button>
        </div>

        <div id="statsBar" class="stats-bar" style="display: none;">
            <div class="stat-item">
                <div class="stat-label">Total Playlists</div>
                <div class="stat-value" id="totalPlaylists">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Total Categories</div>
                <div class="stat-value" id="totalCategories">0</div>
            </div>
        </div>

        <div id="errorContainer"></div>

        <div id="cachedNotice" class="error-message" style="display: none; background: rgba(168,184,255,0.08); border-color: rgba(168,184,255,0.2); color: var(--md-sys-color-primary);">
            📋 Showing cached data. To refresh from the CMS, use the Refresh button above.
        </div>

        <div class="content-area">
            <div id="playlistsContainer" class="playlists-grid">
                <div class="empty-state">
                    <div class="spinner"></div>
                    <p style="margin-top: 1rem;">Loading playlists...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadPlaylists() {
            const container = document.getElementById('playlistsContainer');
            const errorContainer = document.getElementById('errorContainer');
            const refreshBtn = document.getElementById('refreshBtn');
            const refreshIcon = document.getElementById('refreshIcon');

            errorContainer.innerHTML = '';
            refreshBtn.disabled = true;
            refreshIcon.textContent = '⏳';

            try {
                const response = await fetch('/api/playlists-mapping');
                if (!response.ok) {
                    throw new Error(`Failed to load playlists: ${response.statusText}`);
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                const playlists = data.playlists || [];

                if (data.cached) {
                    document.getElementById('cachedNotice').style.display = 'block';
                }

                if (playlists.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>No playlists found. The page will attempt to fetch from the CMS automatically. If no playlists appear after a few tries, you can manually add them by exporting from the CMS dashboard.</p></div>';
                    document.getElementById('statsBar').style.display = 'none';
                    return;
                }

                // Calculate totals
                let totalCategories = 0;
                playlists.forEach(p => {
                    totalCategories += (p.categories?.length || 0);
                });

                // Update stats
                document.getElementById('totalPlaylists').textContent = playlists.length;
                document.getElementById('totalCategories').textContent = totalCategories;
                document.getElementById('statsBar').style.display = 'flex';

                // Render playlists
                container.innerHTML = playlists.map((playlist, idx) => `
                    <div class="playlist-card" data-playlist-id="${playlist.id}">
                        <div class="playlist-header" onclick="togglePlaylist(this)">
                            <div style="flex: 1;">
                                <div class="playlist-title">${escapeHtml(playlist.title)}</div>
                                <div style="font-size: 0.65rem; color: var(--md-sys-color-outline); margin-top: 3px; font-family: monospace; word-break: break-all; display: flex; align-items: center; gap: 8px;">
                                    <span>${escapeHtml(playlist.playlist_id || '')}</span>
                                    <button onclick="event.stopPropagation(); copyToClipboard('${playlist.playlist_id}', this)" style="background: transparent; border: none; color: var(--md-sys-color-outline); cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: all 0.2s; font-size: 0.7rem; display: flex; align-items: center; justify-content: center;" title="Copy ID" class="copy-btn">📋</button>
                                </div>
                            </div>
                            <div class="playlist-count">${playlist.categories?.length || 0} categories</div>
                            <svg class="expand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="categories-list">
                            <div class="categories-inner">
                                ${renderCategories(playlist.categories || [])}
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading playlists:', error);
                errorContainer.innerHTML = `<div class="error-message">Error: ${escapeHtml(error.message)}</div>`;
                container.innerHTML = '<div class="empty-state"><p>Failed to load playlists. Please try again.</p></div>';
            } finally {
                refreshBtn.disabled = false;
                refreshIcon.textContent = '🔄';
            }
        }

        function renderCategories(categories) {
            if (!Array.isArray(categories) || categories.length === 0) {
                return '<div class="category-item">No categories found</div>';
            }

            return categories.map(cat => {
                let categoryName = cat.title || cat.name || 'Unknown';
                let categoryUUID = cat.category_id ? `<div style="font-size: 0.65rem; color: var(--md-sys-color-outline); margin-top: 4px; font-family: monospace; word-break: break-all; display: flex; align-items: center; gap: 8px;"><span>${escapeHtml(cat.category_id)}</span><button onclick="copyToClipboard('${cat.category_id}', this)" style="background: transparent; border: none; color: var(--md-sys-color-outline); cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: all 0.2s; font-size: 0.7rem; display: flex; align-items: center; justify-content: center;" title="Copy ID" class="copy-btn">📋</button></div>` : '';
                return `<div class="category-item"><span>${escapeHtml(categoryName)}</span>${categoryUUID}</div>`;
            }).join('');
        }

        function togglePlaylist(headerEl) {
            const card = headerEl.closest('.playlist-card');
            card.classList.toggle('expanded');
        }

        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.textContent;
                button.textContent = '✓';
                button.style.color = 'var(--md-custom-color-success)';
                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.color = 'var(--md-sys-color-outline)';
                }, 1500);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text || '').replace(/[&<>"']/g, m => map[m]);
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadPlaylists);
    </script>
</body>
</html>
