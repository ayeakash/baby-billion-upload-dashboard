<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Library Inspector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #090d16;
            --surface: #111827;
            --surface-hover: #1f2937;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.16);
            --text: #f9fafb;
            --muted: #9ca3af;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.25);
            --green: #10b981;
            --amber: #f59e0b;
            --red: #ef4444;
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Minimal Top Header ───────────────────────────────────────────── */
        header {
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 13, 22, 0.8);
            backdrop-filter: blur(8px);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            font-size: 16px;
            letter-spacing: -0.2px;
        }

        .header-brand span {
            color: var(--muted);
            font-weight: 400;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* ── Main Container ───────────────────────────────────────────────── */
        main {
            flex: 1;
            max-width: 1240px;
            width: 100%;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 28px;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── Minimal Panel Card ───────────────────────────────────────────── */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .panel-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .textarea-input {
            width: 100%;
            height: 220px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.6;
            outline: none;
            resize: vertical;
            transition: border-color 0.2s ease;
        }

        .textarea-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .btn-stack {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border);
            color: var(--muted);
        }

        .btn-secondary:hover {
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* ── Stats Bar ────────────────────────────────────────────────────── */
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .stat-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .stat-val {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
        }

        /* ── Progress Bar ─────────────────────────────────────────────────── */
        .progress-wrap {
            margin-bottom: 18px;
            display: none;
        }

        .progress-track {
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.2s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--muted);
            margin-top: 6px;
        }

        /* ── Minimal Table ────────────────────────────────────────────────── */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th {
            color: var(--muted);
            font-weight: 500;
            font-size: 12px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            vertical-align: middle;
        }

        tr:hover td {
            background: var(--surface-hover);
        }

        /* Copyable Video ID Badge */
        .copy-id-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .copy-id-badge:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.4);
            color: #fff;
        }

        .copy-id-badge svg {
            width: 13px;
            height: 13px;
            opacity: 0.7;
        }

        /* Copyable Title Badge */
        .copy-title-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
            color: #e0e7ff;
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.22);
            padding: 5px 9px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            max-width: 320px;
            word-break: break-word;
        }

        .copy-title-badge:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.4);
            color: #fff;
        }

        .copy-title-badge svg {
            width: 13px;
            height: 13px;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .tag-lang {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.06);
            color: var(--muted);
        }

        .tag-lang.English {
            color: #818cf8;
            background: rgba(99, 102, 241, 0.12);
        }

        .tag-lang.Hindi {
            color: #f472b6;
            background: rgba(236, 72, 153, 0.12);
        }

        /* Visibility Status Badges (Active vs Hidden) */
        .vis-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .vis-badge.Active {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .vis-badge.Hidden {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .vis-badge.Unknown {
            background: rgba(156, 163, 175, 0.12);
            color: #9ca3af;
            border: 1px solid rgba(156, 163, 175, 0.25);
        }

        .chip-stack {
            display: flex;
            gap: 4px;
        }

        .chip {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            background: rgba(99, 102, 241, 0.12);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        .empty-msg {
            padding: 40px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        /* ── Minimal Toast ────────────────────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--surface);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            display: none;
            z-index: 100;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <!-- Minimal Header -->
    <header>
        <div class="header-left">
            {% set nav_active = 'inspector' %}{% include "_nav.html" %}
            <a href="/" class="header-brand">
                Video Inspector <span>CMS</span>
            </a>
        </div>
    </header>

    <main>
        <div class="grid">
            <!-- Left Input Column -->
            <div class="panel">
                <div class="panel-header">
                    <span>Input Video IDs</span>
                </div>

                <textarea id="videoIdsInput" class="textarea-input" placeholder="Paste Video IDs here... (one per line)"></textarea>

                <div class="btn-stack">
                    <button class="btn btn-primary" id="btnStart" onclick="startInspection()">
                        Inspect
                    </button>
                    <button class="btn btn-secondary" onclick="clearAll()">
                        Clear
                    </button>
                </div>

                <button class="btn btn-danger" id="btnStop" onclick="stopInspection()" style="display: none; margin-top: 10px; width: 100%;">
                    Stop Inspection
                </button>
            </div>

            <!-- Right Results Column -->
            <div class="panel">
                <div class="stats-bar">
                    <div class="stat-item">
                        <div class="stat-val" id="statTotal">0</div>
                        <div class="stat-label">Total</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-val" id="statProcessed" style="color: var(--accent);">0</div>
                        <div class="stat-label">Inspected</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-val" id="statFound" style="color: var(--green);">0</div>
                        <div class="stat-label">Found</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-val" id="statNotFound" style="color: var(--amber);">0</div>
                        <div class="stat-label">Not Found</div>
                    </div>
                </div>

                <!-- Progress Wrap -->
                <div class="progress-wrap" id="progressWrap">
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-info">
                        <span id="progressText">Inspecting...</span>
                        <span id="progressPct">0%</span>
                    </div>
                </div>

                <!-- Minimal Table -->
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 35px;">#</th>
                                <th>Video ID (Click to Copy)</th>
                                <th>Title (Click to Copy)</th>
                                <th>Language</th>
                                <th>Visibility</th>
                                <th>Age Groups</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTbody">
                            <tr>
                                <td colspan="6" class="empty-msg">
                                    Paste Video IDs on the left and click <strong>Inspect</strong>.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        let pollTimer = null;
        let resultsData = [];

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 2500);
        }

        function copyId(el) {
            const idStr = typeof el === 'string' ? el : (el.getAttribute('data-copy-id') || el.innerText.trim());
            if (!idStr) return;
            navigator.clipboard.writeText(idStr).then(() => {
                showToast(`Copied ID: ${idStr}`);
            }).catch(err => {
                console.error("Copy failed:", err);
            });
        }

        function copyTitle(el) {
            const titleText = typeof el === 'string' ? el : (el.getAttribute('data-copy-title') || el.innerText.trim());
            if (!titleText || titleText === 'N/A' || titleText === 'Not Found') return;
            navigator.clipboard.writeText(titleText).then(() => {
                showToast(`Copied Title: ${titleText}`);
            }).catch(err => {
                console.error("Copy failed:", err);
            });
        }

        async function clearAll() {
            document.getElementById('videoIdsInput').value = '';
            resultsData = [];
            document.getElementById('statTotal').innerText = '0';
            document.getElementById('statProcessed').innerText = '0';
            document.getElementById('statFound').innerText = '0';
            document.getElementById('statNotFound').innerText = '0';
            document.getElementById('progressWrap').style.display = 'none';
            renderTable([]);

            try {
                await fetch('/api/video-inspector/reset', { method: 'POST' });
            } catch(e){}
        }

        async function startInspection() {
            const text = document.getElementById('videoIdsInput').value.trim();
            if (!text) {
                alert("Please enter Video IDs.");
                return;
            }

            const rawIds = text.split(/[\n,\s]+/).map(s => s.trim()).filter(s => s.length > 5);
            if (rawIds.length === 0) {
                alert("No valid Video IDs found.");
                return;
            }

            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnStop').style.display = 'inline-flex';
            document.getElementById('progressWrap').style.display = 'block';

            try {
                const resp = await fetch('/api/video-inspector/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_ids: rawIds })
                });

                const data = await resp.json();
                if (!resp.ok) {
                    alert(data.error || "Failed to start inspection.");
                    resetState();
                    return;
                }

                showToast("Inspection started");
                startPolling();

            } catch (err) {
                alert("Error connecting to server.");
                resetState();
            }
        }

        async function stopInspection() {
            try {
                await fetch('/api/video-inspector/stop', { method: 'POST' });
                showToast("Inspection stopped");
            } catch (e) {}
        }

        function resetState() {
            document.getElementById('btnStart').style.display = 'inline-flex';
            document.getElementById('btnStop').style.display = 'none';
        }

        function startPolling() {
            if (pollTimer) clearInterval(pollTimer);
            pollTimer = setInterval(pollStatus, 1200);
            pollStatus();
        }

        async function pollStatus() {
            try {
                const resp = await fetch('/api/video-inspector/status');
                if (!resp.ok) return;

                const data = await resp.json();
                updateUI(data);

                if (!data.running) {
                    clearInterval(pollTimer);
                    pollTimer = null;
                    resetState();
                }
            } catch (e) {}
        }

        function updateUI(data) {
            document.getElementById('statTotal').innerText = data.total || 0;
            document.getElementById('statProcessed').innerText = data.processed || 0;
            document.getElementById('statFound').innerText = data.success_count || 0;
            document.getElementById('statNotFound').innerText = data.fail_count || 0;

            const total = data.total || 1;
            const processed = data.processed || 0;
            const pct = Math.round((processed / total) * 100);

            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressPct').innerText = pct + '%';

            if (data.running) {
                document.getElementById('progressText').innerText = `Inspecting ${data.current_video_id}... (${processed}/${total})`;
            } else {
                document.getElementById('progressText').innerText = processed > 0 ? "Done" : "Idle";
            }

            if (data.results) {
                resultsData = data.results;
                renderTable(resultsData);
            }
        }

        function renderTable(results) {
            const tbody = document.getElementById('resultsTbody');
            if (!results || results.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty-msg">
                            Paste Video IDs on the left and click <strong>Inspect</strong>.
                        </td>
                    </tr>
                `;
                return;
            }

            const html = results.map((item, idx) => {
                const ageChips = (item.age_groups && item.age_groups.length > 0)
                    ? item.age_groups.map(ag => `<span class="chip">${ag}</span>`).join('')
                    : `<span style="color: var(--muted); font-size: 11px;">None</span>`;

                const langClass = (item.language || '').trim();
                const visStatus = item.visibility_status || 'Unknown';
                const visBadgeHtml = `<span class="vis-badge ${visStatus}">${visStatus}</span>`;

                const titleVal = item.title || 'N/A';

                return `
                    <tr>
                        <td style="color: var(--muted);">${idx + 1}</td>
                        <td>
                            <div class="copy-id-badge" data-copy-id="${escapeHtml(item.video_id)}" onclick="copyId(this)" title="Click to copy Video ID">
                                <span>${item.video_id}</span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                            </div>
                        </td>
                        <td>
                            <div class="copy-title-badge" data-copy-title="${escapeHtml(titleVal)}" onclick="copyTitle(this)" title="Click to copy Title">
                                <span>${escapeHtml(titleVal)}</span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
                            </div>
                        </td>
                        <td>
                            <span class="tag-lang ${langClass}">${escapeHtml(item.language || 'N/A')}</span>
                        </td>
                        <td>
                            ${visBadgeHtml}
                        </td>
                        <td>
                            <div class="chip-stack">${ageChips}</div>
                        </td>
                    </tr>
                `;
            }).join('');

            tbody.innerHTML = html;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // On Page Load: Start completely clean from scratch
        document.addEventListener('DOMContentLoaded', () => {
            fetch('/api/video-inspector/reset', { method: 'POST' }).catch(e=>{});
        });
    </script>
</body>
</html>
